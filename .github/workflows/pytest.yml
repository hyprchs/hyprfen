name: pytest

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - "docs/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7.1.0
        with:
          enable-cache: true

      - name: Cache Lichess test data
        uses: actions/cache@v4
        with:
          path: .cache
          key: lichess-cache-${{ runner.os }}-2013-01-${{ hashFiles('src/hyprfen/lichess_sample.py') }}
          restore-keys: |
            lichess-cache-${{ runner.os }}-2013-01-

      - name: Install dependencies
        run: uv sync --frozen

      - name: Download bitstream compatibility vectors
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/hyprfen-bitstreams_lichess-2013-01_100k.tsv" \
            "https://github.com/hyprchs/hyprfen/releases/download/bitstream-compatibility-v1/hyprfen-bitstreams_lichess-2013-01_100k.tsv"
          echo "2a20ca230d172db191d9981734a2e8d99a97ac9b8747604e5e40580a1650ba7f  $RUNNER_TEMP/hyprfen-bitstreams_lichess-2013-01_100k.tsv" | shasum -a 256 -c -
          echo "HYPRFEN_BITSTREAM_VECTORS=$RUNNER_TEMP/hyprfen-bitstreams_lichess-2013-01_100k.tsv" >> "$GITHUB_ENV"

      - name: Run pytest
        run: uv run pytest -q
